<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tarefas – Clube do Remo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="escudo-bg" aria-hidden="true"></div>

  <div class="container py-5">

    <header class="text-center mb-5">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Clube_do_Remo.svg/250px-Clube_do_Remo.svg.png"
        alt="Escudo Clube do Remo"
        class="escudo-header mb-3"
      />
      <h1 class="display-titulo">Lista de Tarefas</h1>
      <p class="subtitulo">Clube do Remo · Gestão de Atividades</p>
    </header>

    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-8 col-lg-6">
        <form id="formTarefa" novalidate>
          <div class="input-group">
            <input
              type="text"
              id="inputTarefa"
              class="form-control form-control-lg input-remo"
              placeholder="Digite uma nova tarefa…"
              autocomplete="off"
            />
            <button type="submit" class="btn btn-remo btn-lg px-4">
              <i class="bi bi-plus-lg me-1"></i> Adicionar
            </button>
          </div>
          <p id="mensagemErro" class="text-warning mt-2 mb-0 small fw-semibold"></p>
        </form>
      </div>
    </div>

    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-8 col-lg-6 d-flex gap-2 flex-wrap">
        <button id="btnCarregarAPI" class="btn btn-outline-remo">
          <i class="bi bi-cloud-download me-1"></i> Carregar da API
        </button>
        <button id="btnLimpar" class="btn btn-outline-danger">
          <i class="bi bi-trash me-1"></i> Limpar tudo
        </button>
      </div>
    </div>

    <div id="loading" class="text-center d-none my-3">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Carregando…</span>
      </div>
      <p class="text-light mt-2 small">Buscando tarefas da API…</p>
    </div>

    <div id="alertaErro" class="alert alert-danger d-none text-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="textoErro">Erro ao carregar dados da API.</span>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <ul id="listaTarefas" class="list-group lista-remo"></ul>
        <p id="semTarefas" class="text-center text-light opacity-50 mt-4 d-none">
          Nenhuma tarefa adicionada ainda.
        </p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
