<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lista de Tarefas - Clube do Remo</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="escudo-bg"></div>

    <div class="container py-5">
      <header class="text-center mb-5">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Clube_do_Remo.svg/250px-Clube_do_Remo.svg.png"
          class="escudo-header mb-3"
          alt="Escudo"
        />

        <h1 class="display-titulo">Lista de Tarefas</h1>

        <p class="subtitulo">Clube do Remo • Gestão de Atividades</p>
      </header>

      <div class="row justify-content-center mb-4">
        <div class="col-md-8 col-lg-6">
          <form id="formTarefa">
            <div class="input-group">
              <input
                type="text"
                id="inputTarefa"
                class="form-control form-control-lg input-remo"
                placeholder="Digite uma tarefa"
              />

              <button class="btn btn-remo btn-lg">
                <i class="bi bi-plus-lg"></i>
                Adicionar
              </button>
            </div>

            <p id="mensagemErro" class="text-warning mt-2 small fw-bold"></p>
          </form>
        </div>
      </div>

      <div class="row justify-content-center mb-4">
        <div class="col-md-8 col-lg-6 d-flex gap-2">
          <button id="btnCarregarAPI" class="btn btn-outline-remo">
            <i class="bi bi-cloud-download"></i>
            Carregar API
          </button>

          <button id="btnLimpar" class="btn btn-outline-danger">
            <i class="bi bi-trash"></i>
            Limpar Tudo
          </button>
        </div>
      </div>

      <div id="loading" class="text-center d-none">
        <div class="spinner-border text-light"></div>

        <p class="mt-2">Buscando tarefas...</p>
      </div>

      <div id="alertaErro" class="alert alert-danger d-none"></div>

      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <ul id="listaTarefas" class="list-group lista-remo"></ul>

          <p id="semTarefas" class="text-center mt-4 d-none">
            Nenhuma tarefa cadastrada.
          </p>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
