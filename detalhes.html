<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detalhes da Tarefa</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="display-titulo">Detalhes da Tarefa</h1>
      </div>

      <div id="loading" class="text-center">
        <div class="spinner-border text-light"></div>

        <p class="mt-3">Carregando informações...</p>
      </div>

      <div id="erro" class="alert alert-danger d-none"></div>

      <div id="cardDetalhes" class="card d-none">
        <div class="card-body">
          <h3 id="titulo"></h3>

          <hr />

          <p>
            <strong>ID:</strong>
            <span id="id"></span>
          </p>

          <p>
            <strong>Usuário:</strong>
            <span id="userId"></span>
          </p>

          <p>
            <strong>Status:</strong>
            <span id="status"></span>
          </p>

          <a href="index.html" class="btn btn-primary"> Voltar </a>
        </div>
      </div>
    </div>

    <script src="js/detalhes.js"></script>
  </body>
</html>
